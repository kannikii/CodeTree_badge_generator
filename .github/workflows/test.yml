name: Test

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "codetree_badge/**"
      - "tests/**"
      - ".github/workflows/test.yml"

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t . -v
